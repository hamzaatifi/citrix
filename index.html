<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caisse Journalière</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--bd:#dde2ee;--ac:#2563eb;--cash:#16a34a;--carte:#7c3aed;--neg:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2c3550;--ac:#6b9bff;--cash:#4ade80;--carte:#b197fc;--neg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141d;--card:#1a2030;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2c3550;--ac:#6b9bff;--cash:#4ade80;--carte:#b197fc;--neg:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:760px;margin-inline:auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
input{min-width:0;flex:1}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:10px 14px}
.seg button.on{background:var(--ac);color:#fff}
label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:14px}
label input{flex:none;width:18px;height:18px;padding:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col h3{margin:0 0 6px;text-align:center;font-size:14px;letter-spacing:.5px;padding:6px;border-radius:8px;color:#fff}
.col.cash h3{background:var(--cash)}.col.carte h3{background:var(--carte)}
.it{display:flex;justify-content:space-between;align-items:center;gap:4px;border-bottom:1px solid var(--bd);padding:7px 2px;font-size:14px}
.it span:first-child{overflow-wrap:anywhere}
.it b{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--neg)}
.x{border:0;background:none;color:var(--mut);padding:2px 6px}
.tot{display:flex;justify-content:space-between;margin-top:8px;padding:8px;border-radius:8px;background:var(--bg);font-weight:700}
.grand{text-align:center;font-size:22px;font-weight:800;margin-top:10px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tr.cur td{background:var(--bg);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.empty{color:var(--mut);text-align:center;padding:10px;font-size:13px}
#auth{max-width:380px;margin:40px auto}#auth input{width:100%;margin-bottom:8px;flex:none}#msg{color:var(--neg);font-size:13px;margin-top:8px;min-height:16px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:8px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
</head>
<body>
<div id="auth" class="card" style="display:none"><h1>💰 Caisse Journalière</h1><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (6+ caractères)" autocomplete="current-password"><div class="row"><button class="p" id="in" style="flex:1">Se connecter</button><button id="up" style="flex:1">Créer compte</button></div><div id="msg"></div></div>
<div id="app" style="display:none"><div class="top"><span id="who"></span><button id="out">Déconnexion</button></div>
<h1>💰 Caisse Journalière</h1>

<div class="card">
  <div class="row">
    <button id="prev">‹</button>
    <input type="date" id="date">
    <button id="next">›</button>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <input id="ref" placeholder="Référence (ex: IDDRKKW)" autocomplete="off">
    <input id="amt" type="number" inputmode="decimal" placeholder="Montant" style="max-width:120px">
  </div>
  <div class="row">
    <div class="seg"><button id="tc" class="on">CASH</button><button id="tk">CARTE</button></div>
    <label><input type="checkbox" id="rf"> Refund</label>
    <button class="p" id="add" style="margin-left:auto">Ajouter</button>
  </div>
</div>

<div class="card">
  <div class="cols">
    <div class="col cash"><h3>CASH</h3><div id="lc"></div></div>
    <div class="col carte"><h3>CARTE</h3><div id="lk"></div></div>
  </div>
  <div class="cols">
    <div class="tot"><span>CASH</span><span id="tc2">0</span></div>
    <div class="tot"><span>CARTE</span><span id="tk2">0</span></div>
  </div>
  <div class="grand">Total: <span id="tt">0</span></div>
</div>

<div class="card">
  <b>Résumé kol nhar</b>
  <div class="sc"><table>
    <thead><tr><th>Nhar</th><th>Cash</th><th>Carte</th><th>Total</th></tr></thead>
    <tbody id="sum"></tbody>
    <tfoot id="sumf"></tfoot>
  </table></div>
</div>

</div>
<script>
var SB_URL="https://tmekctwbxrlmqzcuroae.supabase.co",SB_KEY="sb_publishable_uItFZQS134hNVRJDH29obw_SyXA7Pz7";
var sb=supabase.createClient(SB_URL,SB_KEY),data={},type="cash",cur="",started=false;
function $(i){return document.getElementById(i)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shift(n){var d=new Date(cur+"T12:00:00");d.setDate(d.getDate()+n);cur=iso(d);render()}
function fmt(n){return (Math.round(n*100)/100).toLocaleString("fr-FR")}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sums(arr){var c=0,k=0;arr.forEach(function(x){if(x.type=="cash")c+=x.amt;else k+=x.amt});return[c,k]}
function list(arr,t){
  var r=arr.filter(function(x){return x.type==t});
  if(!r.length)return '<div class="empty">—</div>';
  return r.map(function(x){return '<div class="it"><span>'+esc(x.ref||"")+'</span><span><b class="'+(x.amt<0?"neg":"")+'">'+fmt(x.amt)+'</b><button class="x" data-id="'+x.id+'">✕</button></span></div>'}).join("");
}
function render(){
  $("date").value=cur;
  var arr=data[cur]||[],t=sums(arr);
  $("lc").innerHTML=list(arr,"cash");$("lk").innerHTML=list(arr,"carte");
  $("tc2").textContent=fmt(t[0]);$("tk2").textContent=fmt(t[1]);$("tt").textContent=fmt(t[0]+t[1]);
  var keys=Object.keys(data).filter(function(k){return data[k].length}).sort(),gc=0,gk=0;
  $("sum").innerHTML=keys.length?keys.map(function(k){var q=sums(data[k]);gc+=q[0];gk+=q[1];
    var p=k.split("-");
    return '<tr data-d="'+k+'" class="'+(k==cur?"cur":"")+'"><td>'+p[2]+"/"+p[1]+'</td><td>'+fmt(q[0])+'</td><td>'+fmt(q[1])+'</td><td>'+fmt(q[0]+q[1])+'</td></tr>'}).join(""):'<tr><td colspan="4" class="empty">Mazal ma kayn walo</td></tr>';
  $("sumf").innerHTML=keys.length?'<tr><td>Total</td><td>'+fmt(gc)+'</td><td>'+fmt(gk)+'</td><td>'+fmt(gc+gk)+'</td></tr>':"";
}
function setType(t){type=t;$("tc").className=t=="cash"?"on":"";$("tk").className=t=="carte"?"on":""}
$("tc").onclick=function(){setType("cash")};
$("tk").onclick=function(){setType("carte")};
$("prev").onclick=function(){shift(-1)};
$("next").onclick=function(){shift(1)};
$("date").onchange=function(){if(this.value){cur=this.value;render()}};
async function add(){
  var v=parseFloat($("amt").value);
  if(isNaN(v)){$("amt").focus();return}
  if($("rf").checked)v=-Math.abs(v);
  var r=await sb.from("entries").insert({day:cur,ref:$("ref").value.trim(),amt:v,type:type}).select().single();
  if(r.error){alert("Erreur: "+r.error.message);return}
  (data[cur]=data[cur]||[]).push({id:r.data.id,ref:r.data.ref,amt:Number(r.data.amt),type:r.data.type});
  $("ref").value="";$("amt").value="";$("rf").checked=false;$("ref").focus();render();
}
$("add").onclick=add;
$("amt").onkeydown=function(e){if(e.key=="Enter")add()};
document.addEventListener("click",function(e){
  var x=e.target.closest(".x");
  if(x){sb.from("entries").delete().eq("id",x.dataset.id).then(function(r){if(r.error){alert(r.error.message);return}data[cur]=(data[cur]||[]).filter(function(i){return i.id!=x.dataset.id});render()});return}
  var tr=e.target.closest("tr[data-d]");
  if(tr){cur=tr.dataset.d;render();window.scrollTo(0,0)}
});
cur=iso(new Date());
function msg(t){$("msg").textContent=t||""}
async function start(sess){
  $("auth").style.display="none";$("app").style.display="block";
  $("who").textContent="✅ "+sess.user.email;
  var r=await sb.from("entries").select("*").order("created_at").limit(5000);
  data={};
  if(r.data)r.data.forEach(function(x){(data[x.day]=data[x.day]||[]).push({id:x.id,ref:x.ref,amt:Number(x.amt),type:x.type})});
  render();
}
function showAuth(){$("app").style.display="none";$("auth").style.display="block";data={}}
$("in").onclick=async function(){msg();var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(r.error)msg(r.error.message)};
$("up").onclick=async function(){msg();var r=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});if(r.error)msg(r.error.message);else if(!r.data.session)msg("Compte créé. Verifie ton email puis connecte-toi.")};
$("out").onclick=function(){sb.auth.signOut()};
sb.auth.onAuthStateChange(function(ev,sess){
  if(sess){if(!started||ev=="SIGNED_IN"){started=true;setTimeout(function(){start(sess)},0)}}
  else{started=false;showAuth()}
});
sb.auth.getSession().then(function(r){if(!r.data.session)showAuth()});
</script>
</body>
</html>
